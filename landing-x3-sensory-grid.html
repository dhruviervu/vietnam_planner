<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vietnam — Sensory Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #120f0d;
      --quiet: #f7f2ea;
      --muted: #5e574f;
      --lantern: #c4321a;
      --paddy: #5a8f3c;
      --sea: #2a6f8f;
      --spice: #d4782a;
      --night: #1a2744;
      --silk: #b86b8a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "IBM Plex Sans", sans-serif; color: var(--ink); background: #0e0c0a;
      -webkit-font-smoothing: antialiased;
    }
    img { display: block; width: 100%; height: 100%; object-fit: cover; }

    .mosaic {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-auto-rows: minmax(70px, 11vh);
      gap: 4px;
      min-height: 100vh;
      padding: 4px;
    }

    .cell {
      overflow: hidden; position: relative; background: #222;
      min-height: 70px;
    }
    .swatch { min-height: 70px; }

    /* Quiet cell — calm island in the density */
    .quiet {
      grid-column: 3 / 7;
      grid-row: 3 / 7;
      background: var(--quiet);
      display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
      padding: clamp(1.25rem, 3vw, 2.5rem);
      z-index: 2;
      box-shadow: 0 0 0 4px #0e0c0a;
    }
    .quiet h1 {
      font-family: Syne, sans-serif; font-weight: 800;
      font-size: clamp(1.8rem, 3.5vw, 3rem); letter-spacing: -.03em;
      line-height: 1.05; margin-bottom: .75rem; max-width: 10ch;
    }
    .quiet p {
      color: var(--muted); font-size: clamp(.9rem, 1.3vw, 1.02rem);
      max-width: 34ch; margin-bottom: 1.35rem; line-height: 1.5;
    }
    .actions { display: flex; flex-wrap: wrap; gap: .55rem; }
    .btn {
      font: 500 .88rem "IBM Plex Sans", sans-serif; padding: .8rem 1.15rem;
      border-radius: 2px; cursor: pointer; border: 1.5px solid transparent;
      transition: background .2s ease, color .2s ease;
    }
    .btn-solid { background: var(--ink); color: var(--quiet); }
    .btn-outline { background: transparent; border-color: rgba(18,15,13,.35); color: var(--ink); }

    /* Photo / swatch placements — dense mosaic around the quiet cell */
    .c1 { grid-column: 1 / 3; grid-row: 1 / 3; }
    .c2 { grid-column: 3 / 5; grid-row: 1 / 2; }
    .c3 { grid-column: 5 / 7; grid-row: 1 / 3; }
    .c4 { grid-column: 7 / 9; grid-row: 1 / 2; background: var(--lantern); }
    .c5 { grid-column: 7 / 9; grid-row: 2 / 3; }
    .c6 { grid-column: 1 / 2; grid-row: 3 / 5; background: var(--paddy); }
    .c7 { grid-column: 2 / 3; grid-row: 3 / 4; }
    .c8 { grid-column: 2 / 3; grid-row: 4 / 5; background: var(--spice); }
    .c9 { grid-column: 7 / 8; grid-row: 3 / 5; }
    .c10 { grid-column: 8 / 9; grid-row: 3 / 4; background: var(--sea); }
    .c11 { grid-column: 8 / 9; grid-row: 4 / 6; }
    .c12 { grid-column: 1 / 3; grid-row: 5 / 7; }
    .c13 { grid-column: 7 / 8; grid-row: 5 / 6; background: var(--silk); }
    .c14 { grid-column: 7 / 9; grid-row: 6 / 8; }
    .c15 { grid-column: 1 / 2; grid-row: 7 / 9; background: var(--night); }
    .c16 { grid-column: 2 / 4; grid-row: 7 / 8; }
    .c17 { grid-column: 4 / 6; grid-row: 7 / 9; }
    .c18 { grid-column: 6 / 7; grid-row: 7 / 8; background: var(--lantern); }
    .c19 { grid-column: 2 / 4; grid-row: 8 / 9; background: var(--paddy); }
    .c20 { grid-column: 6 / 8; grid-row: 8 / 9; }

    .tag {
      position: absolute; left: 6px; bottom: 6px;
      font-size: .62rem; font-weight: 500; letter-spacing: .04em;
      color: #fff; background: rgba(0,0,0,.45); padding: .2rem .4rem;
      pointer-events: none;
    }

    .cell:hover img { transform: scale(1.06); }
    .cell img { transition: transform .35s ease; }

    @media (max-width: 900px) {
      .mosaic {
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: minmax(64px, 9vh);
      }
      .quiet {
        grid-column: 1 / 5;
        grid-row: 3 / 6;
      }
      .c1 { grid-column: 1 / 3; grid-row: 1 / 3; }
      .c2 { grid-column: 3 / 5; grid-row: 1 / 2; }
      .c3 { grid-column: 3 / 5; grid-row: 2 / 3; }
      .c4 { grid-column: 1 / 2; grid-row: 6 / 7; }
      .c5 { grid-column: 2 / 3; grid-row: 6 / 7; }
      .c6 { grid-column: 3 / 4; grid-row: 6 / 7; }
      .c7 { grid-column: 4 / 5; grid-row: 6 / 7; }
      .c8 { grid-column: 1 / 2; grid-row: 7 / 8; }
      .c9 { grid-column: 2 / 4; grid-row: 7 / 9; }
      .c10 { grid-column: 4 / 5; grid-row: 7 / 8; }
      .c11 { grid-column: 1 / 3; grid-row: 8 / 10; }
      .c12 { grid-column: 4 / 5; grid-row: 8 / 9; }
      .c13 { grid-column: 3 / 5; grid-row: 9 / 10; }
      .c14 { grid-column: 1 / 3; grid-row: 10 / 12; }
      .c15 { grid-column: 3 / 4; grid-row: 10 / 11; }
      .c16 { grid-column: 4 / 5; grid-row: 10 / 11; }
      .c17 { grid-column: 3 / 5; grid-row: 11 / 13; }
      .c18 { grid-column: 1 / 2; grid-row: 12 / 13; }
      .c19 { grid-column: 2 / 3; grid-row: 12 / 13; }
      .c20 { grid-column: 1 / 3; grid-row: 13 / 14; }
    }
  </style>
</head>
<body>
  <div class="mosaic" aria-label="Sensory collage of Vietnam">
    <div class="cell c1">
      <img src="https://picsum.photos/seed/streetfood-x3/600/600" alt="Street food" />
      <span class="tag">Street food</span>
    </div>
    <div class="cell c2">
      <img src="https://picsum.photos/seed/lanterns-x3/700/400" alt="Lanterns" />
    </div>
    <div class="cell c3">
      <img src="https://picsum.photos/seed/motorbikes-x3/700/700" alt="Motorbike traffic" />
      <span class="tag">Traffic</span>
    </div>
    <div class="cell swatch c4" aria-hidden="true" title="Lantern red"></div>
    <div class="cell c5">
      <img src="https://picsum.photos/seed/fabric-x3/500/400" alt="Fabric pattern" />
    </div>

    <div class="cell swatch c6" aria-hidden="true" title="Rice paddy green"></div>
    <div class="cell c7">
      <img src="https://picsum.photos/seed/pho-x3/400/400" alt="Pho" />
    </div>
    <div class="cell swatch c8" aria-hidden="true" title="Spice orange"></div>

    <div class="quiet">
      <h1>Vietnam, End to End</h1>
      <p>From misted northern bays to the Mekong’s slow rivers — all the noise, flavor, and light at once.</p>
      <div class="actions">
        <button type="button" class="btn btn-solid">Just Plan My Trip</button>
        <button type="button" class="btn btn-outline">Explore Vietnam</button>
      </div>
    </div>

    <div class="cell c9">
      <img src="https://picsum.photos/seed/ricepaddy-x3/400/700" alt="Rice paddies" />
    </div>
    <div class="cell swatch c10" aria-hidden="true" title="Sea blue"></div>
    <div class="cell c11">
      <img src="https://picsum.photos/seed/market-x3/400/700" alt="Market" />
      <span class="tag">Market</span>
    </div>

    <div class="cell c12">
      <img src="https://picsum.photos/seed/halong-x3/700/700" alt="Ha Long Bay" />
      <span class="tag">Ha Long</span>
    </div>
    <div class="cell swatch c13" aria-hidden="true" title="Silk pink"></div>
    <div class="cell c14">
      <img src="https://picsum.photos/seed/hoian-x3/700/700" alt="Hoi An" />
    </div>

    <div class="cell swatch c15" aria-hidden="true" title="Night indigo"></div>
    <div class="cell c16">
      <img src="https://picsum.photos/seed/coffee-x3/600/300" alt="Coffee" />
    </div>
    <div class="cell c17">
      <img src="https://picsum.photos/seed/hanoi-x3/800/700" alt="Hanoi" />
      <span class="tag">Hanoi</span>
    </div>
    <div class="cell swatch c18" aria-hidden="true" title="Lantern red"></div>
    <div class="cell swatch c19" aria-hidden="true" title="Paddy green"></div>
    <div class="cell c20">
      <img src="https://picsum.photos/seed/mekong-x3/600/300" alt="Mekong" />
    </div>
  </div>
</body>
</html>
