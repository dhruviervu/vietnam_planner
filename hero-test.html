<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vietnam Path — Hero Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-a: #e8f0e9;
      --bg-b: #f7faf7;
      --ink: #2a332c;
      --muted: #5c665f;
      --line: #6b7d72;
      --dot: #3d5348;
      --card-bg: rgba(255, 255, 255, 0.9);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      background: #fafaf8;
      line-height: 1.5;
    }

    .path-section {
      position: relative;
      /* Tall enough that each node can pass the viewport midline while scrolling */
      min-height: 100vh;
      height: 280vh;
      background: linear-gradient(
        165deg,
        var(--bg-a) 0%,
        var(--bg-b) 52%,
        var(--bg-a) 100%
      );
      transition: background 0.55s ease;
    }

    .path-canvas {
      position: relative;
      width: min(420px, 86vw);
      height: 100%;
      margin: 0 auto;
    }

    .path-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .path-svg path {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.25;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.75;
    }

    .node {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 2;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: inherit;
      text-align: left;
    }

    .node-dot {
      display: block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--dot);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 0 1px rgba(61, 83, 72, 0.15);
      transition: transform 0.35s ease;
      transform-origin: center center;
    }

    .node.is-active .node-dot {
      transform: scale(1.75);
    }

    .node-label {
      position: absolute;
      top: 50%;
      white-space: nowrap;
      font-family: "Newsreader", serif;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: var(--ink);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .node[data-side="right"] .node-label {
      left: 22px;
    }

    .node[data-side="left"] .node-label {
      right: 22px;
      text-align: right;
    }

    .node-card {
      position: absolute;
      top: calc(50% + 18px);
      width: 180px;
      padding: 10px;
      background: var(--card-bg);
      border: 1px solid rgba(61, 83, 72, 0.12);
      border-radius: 6px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(6px);
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
      pointer-events: none;
      z-index: 3;
    }

    .node[data-side="right"] .node-card {
      left: 22px;
    }

    .node[data-side="left"] .node-card {
      right: 22px;
    }

    .node.is-open .node-card {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
    }

    .node-card img {
      display: block;
      width: 100%;
      height: 96px;
      object-fit: cover;
      border-radius: 3px;
      margin-bottom: 8px;
    }

    .node-card p {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .cta-section {
      min-height: 40vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 4rem 1.5rem;
      background: #fafaf8;
    }

    .cta-section button {
      font-family: "DM Sans", sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 0.85rem 1.6rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    .btn-primary {
      background: #3d5348;
      color: #f7faf7;
      border: 1px solid #3d5348;
    }

    .btn-primary:hover {
      background: #2f4238;
    }

    .btn-secondary {
      background: transparent;
      color: #3d5348;
      border: 1px solid rgba(61, 83, 72, 0.45);
    }

    .btn-secondary:hover {
      border-color: #3d5348;
      background: rgba(61, 83, 72, 0.04);
    }

    @media (max-width: 520px) {
      .node-label {
        font-size: 0.82rem;
      }

      .node-card {
        width: 150px;
      }

      .cta-section {
        flex-direction: column;
        align-items: stretch;
        max-width: 280px;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <section class="path-section" id="pathSection" aria-label="Vietnam route path">
    <div class="path-canvas" id="pathCanvas">
      <!-- Loose S-curve: rough Vietnam coastline silhouette, top → bottom -->
      <svg class="path-svg" viewBox="0 0 100 200" preserveAspectRatio="none" aria-hidden="true">
        <path
          id="coastPath"
          d="M 58 4
             C 62 22, 70 38, 72 52
             C 74 68, 66 78, 52 88
             C 38 98, 28 110, 32 126
             C 36 142, 48 152, 54 166
             C 60 180, 52 190, 46 196"
        />
      </svg>

      <button type="button" class="node" data-index="0" data-side="right" data-progress="0.08" aria-expanded="false">
        <span class="node-dot" aria-hidden="true"></span>
        <span class="node-label">Hanoi</span>
        <div class="node-card">
          <img src="https://picsum.photos/seed/hanoi/360/200" alt="" width="180" height="96" />
          <p>Quiet lakes and old-quarter streets at the northern start of the journey.</p>
        </div>
      </button>

      <button type="button" class="node" data-index="1" data-side="left" data-progress="0.28" aria-expanded="false">
        <span class="node-dot" aria-hidden="true"></span>
        <span class="node-label">Ha Long Bay</span>
        <div class="node-card">
          <img src="https://picsum.photos/seed/halong/360/200" alt="" width="180" height="96" />
          <p>Limestone karsts rising from calm jade water along the northern coast.</p>
        </div>
      </button>

      <button type="button" class="node" data-index="2" data-side="right" data-progress="0.5" aria-expanded="false">
        <span class="node-dot" aria-hidden="true"></span>
        <span class="node-label">Hue</span>
        <div class="node-card">
          <img src="https://picsum.photos/seed/hue/360/200" alt="" width="180" height="96" />
          <p>Imperial citadel and river mornings in the country’s geographic middle.</p>
        </div>
      </button>

      <button type="button" class="node" data-index="3" data-side="left" data-progress="0.72" aria-expanded="false">
        <span class="node-dot" aria-hidden="true"></span>
        <span class="node-label">Hoi An</span>
        <div class="node-card">
          <img src="https://picsum.photos/seed/hoian/360/200" alt="" width="180" height="96" />
          <p>Lantern-lit lanes and a soft riverside pace just south of the center.</p>
        </div>
      </button>

      <button type="button" class="node" data-index="4" data-side="right" data-progress="0.92" aria-expanded="false">
        <span class="node-dot" aria-hidden="true"></span>
        <span class="node-label">Ho Chi Minh City</span>
        <div class="node-card">
          <img src="https://picsum.photos/seed/hcmc/360/200" alt="" width="180" height="96" />
          <p>Energy and street life at the southern end of the route.</p>
        </div>
      </button>
    </div>
  </section>

  <section class="cta-section" aria-label="Next steps">
    <button type="button" class="btn-primary">Explore Vietnam</button>
    <button type="button" class="btn-secondary">Just Plan My Trip</button>
  </section>

  <script>
    (function () {
      const tints = [
        { a: "#e8f0e9", b: "#f7faf7" }, // Hanoi — soft sage
        { a: "#e4eef5", b: "#f5f9fc" }, // Ha Long — mist blue
        { a: "#f3ebe3", b: "#faf6f1" }, // Hue — warm sand
        { a: "#e9f2f0", b: "#f5faf8" }, // Hoi An — seafoam
        { a: "#f0ebe8", b: "#faf7f5" }, // HCMC — soft clay
      ];

      const section = document.getElementById("pathSection");
      const canvas = document.getElementById("pathCanvas");
      const path = document.getElementById("coastPath");
      const nodes = Array.from(document.querySelectorAll(".node"));

      function placeNodes() {
        const length = path.getTotalLength();
        const svg = path.ownerSVGElement;
        const cRect = canvas.getBoundingClientRect();
        const sRect = svg.getBoundingClientRect();

        nodes.forEach(function (node) {
          const progress = parseFloat(node.dataset.progress, 10);
          const point = path.getPointAtLength(length * progress);
          const x = (point.x / 100) * sRect.width + (sRect.left - cRect.left);
          const y = (point.y / 200) * sRect.height + (sRect.top - cRect.top);
          node.style.left = x + "px";
          node.style.top = y + "px";
        });
      }

      function updateActiveFromScroll() {
        const mid = window.innerHeight / 2;
        let bestIndex = 0;
        let bestDist = Infinity;

        nodes.forEach(function (node, i) {
          const rect = node.getBoundingClientRect();
          const centerY = rect.top + rect.height / 2;
          const dist = Math.abs(centerY - mid);
          if (dist < bestDist) {
            bestDist = dist;
            bestIndex = i;
          }
        });

        nodes.forEach(function (node, i) {
          node.classList.toggle("is-active", i === bestIndex);
        });

        const tint = tints[bestIndex];
        section.style.setProperty("--bg-a", tint.a);
        section.style.setProperty("--bg-b", tint.b);
      }

      nodes.forEach(function (node) {
        node.addEventListener("click", function () {
          const willOpen = !node.classList.contains("is-open");
          nodes.forEach(function (n) {
            n.classList.remove("is-open");
            n.setAttribute("aria-expanded", "false");
          });
          if (willOpen) {
            node.classList.add("is-open");
            node.setAttribute("aria-expanded", "true");
          }
        });
      });

      let ticking = false;
      function onScrollOrResize() {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function () {
          placeNodes();
          updateActiveFromScroll();
          ticking = false;
        });
      }

      window.addEventListener("scroll", onScrollOrResize, { passive: true });
      window.addEventListener("resize", onScrollOrResize);

      placeNodes();
      updateActiveFromScroll();
      requestAnimationFrame(placeNodes);
    })();
  </script>
</body>
</html>
