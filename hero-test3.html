<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vietnam Collage — Hero Test 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f1eb;
      --ink: #1c1a17;
      --muted: #5a554e;
      --chip-bg: rgba(28, 26, 23, 0.55);
      --chip-text: #f7f5f0;
      --line: rgba(28, 26, 23, 0.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Work Sans", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    .hero {
      position: relative;
      min-height: 100vh;
      width: 100%;
      overflow: hidden;
      padding: clamp(1.5rem, 4vw, 3.5rem) clamp(1.25rem, 5vw, 4.5rem)
        clamp(1.75rem, 4vw, 3rem);
      display: flex;
      flex-direction: column;
    }

    .hero-stage {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      min-height: 0;
    }

    /* Large photo — ~55% width, offset right, not centered */
    .photo-main {
      position: absolute;
      top: 8%;
      right: 4%;
      width: 55%;
      aspect-ratio: 4 / 5;
      max-height: 78%;
      z-index: 2;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(28, 26, 23, 0.14);
    }

    .photo-main img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo {
      position: absolute;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(28, 26, 23, 0.16);
      z-index: 3;
    }

    .photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Smaller photos — varied sizes, overlapping the large one */
    .photo-a {
      top: 4%;
      left: 6%;
      width: 22%;
      aspect-ratio: 5 / 4;
      z-index: 4;
    }

    .photo-b {
      top: 18%;
      right: 0;
      width: 18%;
      aspect-ratio: 3 / 4;
      z-index: 5;
    }

    .photo-c {
      bottom: 22%;
      left: 2%;
      width: 20%;
      aspect-ratio: 1 / 1;
      z-index: 4;
    }

    .photo-d {
      bottom: 10%;
      right: 18%;
      width: 24%;
      aspect-ratio: 16 / 11;
      z-index: 5;
    }

    .chip {
      position: absolute;
      left: 0.55rem;
      bottom: 0.55rem;
      padding: 0.28rem 0.65rem;
      border-radius: 999px;
      background: var(--chip-bg);
      color: var(--chip-text);
      font-family: "Work Sans", sans-serif;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      line-height: 1.2;
      white-space: nowrap;
    }

    .photo-b .chip,
    .photo-d .chip {
      left: auto;
      right: 0.55rem;
    }

    /* Type block — starts left, overlaps large photo’s left edge */
    .copy {
      position: absolute;
      top: 34%;
      left: 0;
      width: min(52%, 520px);
      z-index: 6;
      pointer-events: none;
    }

    .copy h1 {
      font-family: "Fraunces", serif;
      font-weight: 600;
      font-size: clamp(2.6rem, 6.2vw, 5.1rem);
      line-height: 0.98;
      letter-spacing: -0.02em;
      color: var(--ink);
      /* Soft lift so type stays readable over the photo */
      text-shadow:
        0 0 18px rgba(244, 241, 235, 0.85),
        0 0 4px rgba(244, 241, 235, 0.9);
    }

    .copy p {
      margin-top: 1.1rem;
      max-width: 28ch;
      font-size: clamp(0.9rem, 1.35vw, 1.05rem);
      font-weight: 400;
      color: var(--muted);
      line-height: 1.55;
      text-shadow: 0 0 12px rgba(244, 241, 235, 0.9);
    }

    .actions {
      position: relative;
      z-index: 7;
      display: flex;
      gap: 0.85rem;
      justify-content: flex-start;
      max-width: 1180px;
      width: 100%;
      margin: 1.25rem auto 0;
      padding-top: 0.25rem;
    }

    .actions button {
      font-family: "Work Sans", sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 0;
      padding: 0.85rem 1.45rem;
      cursor: pointer;
    }

    @media (max-width: 820px) {
      .hero {
        padding: 1.25rem 1.1rem 1.5rem;
      }

      .photo-main {
        top: 22%;
        right: 0;
        width: 62%;
        max-height: 58%;
      }

      .photo-a {
        top: 2%;
        left: 0;
        width: 36%;
      }

      .photo-b {
        top: 8%;
        right: 0;
        width: 28%;
      }

      .photo-c {
        bottom: 28%;
        left: 0;
        width: 30%;
      }

      .photo-d {
        bottom: 14%;
        right: 4%;
        width: 38%;
      }

      .copy {
        top: 12%;
        width: 70%;
      }

      .actions {
        flex-wrap: wrap;
      }
    }

    @media (max-width: 520px) {
      .copy {
        width: 78%;
      }

      .copy h1 {
        font-size: clamp(2.2rem, 11vw, 2.8rem);
      }

      .actions {
        flex-direction: column;
        align-items: stretch;
      }

      .actions button {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <section class="hero" aria-label="Vietnam hero collage">
    <div class="hero-stage">
      <figure class="photo-main" aria-label="Ho Chi Minh City">
        <img
          src="https://picsum.photos/seed/hochiminh/800/1000"
          alt="Ho Chi Minh City"
          width="800"
          height="1000"
        />
      </figure>

      <figure class="photo photo-a">
        <img
          src="https://picsum.photos/seed/hanoi/640/520"
          alt="Hanoi"
          width="640"
          height="520"
        />
        <span class="chip">Hanoi</span>
      </figure>

      <figure class="photo photo-b">
        <img
          src="https://picsum.photos/seed/halong/480/640"
          alt="Ha Long Bay"
          width="480"
          height="640"
        />
        <span class="chip">Ha Long Bay</span>
      </figure>

      <figure class="photo photo-c">
        <img
          src="https://picsum.photos/seed/hue/560/560"
          alt="Hue"
          width="560"
          height="560"
        />
        <span class="chip">Hue</span>
      </figure>

      <figure class="photo photo-d">
        <img
          src="https://picsum.photos/seed/hoian/720/500"
          alt="Hoi An"
          width="720"
          height="500"
        />
        <span class="chip">Hoi An</span>
      </figure>

      <div class="copy">
        <h1>Vietnam, End to End</h1>
        <p>One country, three climates, a thousand years of history.</p>
      </div>
    </div>

    <div class="actions">
      <button type="button">Explore Vietnam</button>
      <button type="button">Just Plan My Trip</button>
    </div>
  </section>
</body>
</html>
